# The dota-replays jobs on the Maryland worker. Add these entries to the
# worker's policy on the hub's Worker page and edit the `supply` values to the
# node's own paths; `since` is the oldest commit the worker may run. The hub
# sets `SWITCHBOARD_MODULE_TOKEN` for every job of these tasks, so list no
# `secrets`.
#
# The worker needs max_backstop_s of at least 10800, bulk-dota-replays=1, and a
# memory kill limit (`max_mem_mb`) of 0 or at least 3,072.
# The tasks' backstops are update 10800, verify 1800 and check 600; the submit
# helper passes the same numbers.
# SWITCHBOARD_BULK is the database's existing folder on the node's local disk.
# DOTA_REPLAY_DIR is a folder inside the TrueNAS mount
# (here /mnt/truenas), never the mount point itself, so an unmounted share
# fails the job instead of filling the local disk.

[[repo]]
name = "simonliu99/dota-replays"
url = "https://github.com/simonliu99/dota-replays.git"
since = "bba4c5f57c8ce4ab71cfd1b5c8594fe69b74a3f6"

[[task]]
repo = "simonliu99/dota-replays"
name = "update"
entry = "jobs/update"
args = []
supply = { SWITCHBOARD_BULK = "/home/<user>/dota-replays", DOTA_REPLAY_DIR = "/mnt/truenas/dota-replays/replays", SWITCHBOARD_HUB = "https://switchboard.example.com" }

[[task]]
repo = "simonliu99/dota-replays"
name = "verify"
entry = "jobs/verify"
args = []
supply = { SWITCHBOARD_BULK = "/home/<user>/dota-replays", DOTA_REPLAY_DIR = "/mnt/truenas/dota-replays/replays", SWITCHBOARD_HUB = "https://switchboard.example.com" }

[[task]]
repo = "simonliu99/dota-replays"
name = "check"
entry = "jobs/check"
args = []
supply = { SWITCHBOARD_BULK = "/home/<user>/dota-replays", SWITCHBOARD_HUB = "https://switchboard.example.com" }
